server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache env-config.js -- it's regenerated per-container-start and
    # must always be re-fetched, or a browser could pin a stale API URL.
    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
